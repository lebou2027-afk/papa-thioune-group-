const frd=d=>new Date(d+"T12:00:00").toLocaleDateString("fr-FR");
function factures(){
 const rows=D.ventes.slice().reverse().map(v=>{const T=tot(v.lines).ttc,reste=T-(v.acompte==null?T:Math.min(v.acompte,T)),cl_=v.client?nm("clients",v.client):"Comptoir";

let EV=null;
function editV(id){const v=D.ventes.find(x=>x.id==id);CT={k:"v",ev:1,id,num:v.num,tiers:v.client||"",acompte:(v.acompte==null||v.acompte>=tot(v.lines).ttc)?0:v.acompte,mode:v.mode||MODES[0],statut:"",date:v.date,L:JSON.parse(JSON.stringify(v.lines))};cl();page="pos";render();window.scrollTo(0,0)}
function drawEV(){
 modal(`<h3>Modifier la facture ${esc(EV.num)}</h3><div class="g"><label>Client<select onchange="EV.client=this.value">${opts(D.clients.map(x=>[x.id,x.nom]),EV.client,"Client comptoir")}</select></label><label>Date<input type="date" value="${EV.date}" onchange="EV.date=this.value"></label><label>Paiement<select onchange="EV.mode=this.value">${opts([...MODES,SOLDE].map(m=>[m,m]),EV.mode)}</select></label><label>Acompte versé<input type="number" min="0" placeholder="Vide = payé en totalité" value="${EV.acompte||""}" oninput="EV.acompte=+this.value||0;ttv()"></label></div>
 <label style="margin-top:10px">Ajouter un produit<select onchange="addEV(this.value)">${opts(D.produits.map(p=>[p.id,p.nom]),"","+ Choisir un produit…")}</select></label>
 <div class="tw" style="margin-top:10px"><table><thead><tr><th>Produit</th><th>Qté</th><th>Prix</th><th></th></tr></thead><tbody>${EV.L.map((l,i)=>`<tr><td>${esc(l.nom)}</td><td><input type="number" min="1" value="${l.q}" style="width:76px" oninput="EV.L[${i}].q=+this.value||0;ttv()"></td><td><input type="number" min="0" value="${l.p}" style="width:104px" oninput="EV.L[${i}].p=+this.value||0;ttv()"></td><td><button class="b m" onclick="EV.L.splice(${i},1);drawEV()">×</button></td></tr>`).join("")||"<tr><td colspan='4'>Aucun produit</td></tr>"}</tbody></table></div>
 <div class="tt" id="evt"></div><div class="r"><button class="b s" onclick="cl()">Annuler</button><button class="b" onclick="saveEV()">Enregistrer les modifications</button></div>`);
 $("#md").style.maxWidth="820px";ttv()}
function ttv(){const e=$("#evt");if(!e)return;const T=tot(EV.L).ttc,a=Math.min(EV.acompte||0,T);e.textContent="Total : "+fmt(T)+(a?" · Acompte : "+fmt(a)+" · Reste : "+fmt(T-a):"")}
function addEV(id){if(!id)return;const p=D.produits.find(x=>x.id==id),l=EV.L.find(x=>x.pid==id);if(l)l.q++;else EV.L.push({pid:id,nom:p.nom,q:1,p:p.pv,pa:p.pa});drawEV()}
function saveEV(){const v=D.ventes.find(x=>x.id==EV.id),L=EV.L.filter(l=>l.q>0).map(l=>({...l}));
 if(!L.length){toast("Ajoutez au moins un produit");return}
 if(EV.mode==SOLDE){if(!EV.client){toast("Choisissez un client pour payer avec son solde");return}const T0=tot(L).ttc,pd=EV.acompte>0?Math.min(EV.acompte,T0):T0,ex=D.versements.find(x=>x.vid==EV.id);let b=balance("clients",EV.client);if(ex&&ex.tid==EV.client)b+=+ex.montant||0;if(pd>b){toast("Solde insuffisant : "+fmt(b)+" disponible");return}}
 const old={},nw={};v.lines.forEach(l=>old[l.pid]=(old[l.pid]||0)+l.q);L.forEach(l=>nw[l.pid]=(nw[l.pid]||0)+l.q);
 for(const pid in nw){const p=D.produits.find(x=>x.id==pid);if(p&&(+p.stock||0)+(old[pid]||0)<nw[pid]){toast("Stock insuffisant : "+p.nom);return}}
 v.lines.forEach(l=>{const p=D.produits.find(x=>x.id==l.pid);if(p)p.stock=(+p.stock||0)+l.q});
 L.forEach(l=>{const p=D.produits.find(x=>x.id==l.pid);if(p)p.stock=(+p.stock||0)-l.q});
 const T=tot(L).ttc;
 Object.assign(v,{client:EV.client,date:EV.date||v.date,mode:EV.mode,acompte:EV.acompte>0?Math.min(EV.acompte,T):T,lines:L});
 D.versements=D.versements.filter(x=>x.vid!=v.id);if(v.mode==SOLDE)D.versements.push({id:uid(),date:v.date,type:"Achat",kind:"clients",tid:v.client,montant:v.acompte,compte:"",lib:"Achat – facture "+v.num,vid:v.id});
 save();cl();toast("Facture modifiée");return true}

const holderKey=x=>x.tid?x.kind+":"+x.tid:"";

 const W=wallets().sort((a,b)=>holderName(a).localeCompare(holderName(b))),m=today().slice(0,7),M=D.versements.filter(x=>x.date.startsWith(m));
 const rw=W.map(w=>{const sd=w.dep-w.out,nmx=w.tid?nm(w.kind,w.tid):"Non attribué",h=w.tid?w.kind+":"+w.tid:"";

 const rm=D.versements.slice().reverse().map(x=>{const ty=x.type||"Dépôt",pos_=mvSign(x)>0;
  return`<tr><td>${frd(x.date)}<span style="display:none"> ${x.date}</span></td><td>${esc(holderName(x))}</td><td>${ty}</td><td>${esc(x.compte||"")}</td><td>${esc(x.lib||"")}</td><td data-v="${mvSign(x)*(+x.montant||0)}" style="font-weight:800;color:${pos_?"var(--ok)":"var(--ko)"}">${pos_?"+":"−"} ${fmt(x.montant)}</td><td style="white-space:nowrap">${x.vid?"<small>Lié à une facture</small>":`<button class="b s m" onclick="mvForm('','','${x.id}')">Modifier</button> <button class="b x m" onclick="delMV('${x.id}')">Suppr.</button>`}</td></tr>`}).join("");
 return bar("Dépôt d’argent")
 +`<p style="margin:0 0 12px">Argent confié par les clients et partenaires : il peut servir à acheter plus tard (paiement « ${SOLDE} » à la vente rapide) ou être retiré progressivement.</p>`
 +`<div class="kp">${kp("Total confié (soldes)",fmt(sum(W,w=>w.dep-w.out)))}${kp("Comptes ouverts",W.filter(w=>w.tid).length)}${kp("Dépôts du mois",fmt(sum(M.filter(x=>mvSign(x)>0),x=>x.montant)))}${kp("Retraits et achats du mois",fmt(sum(M.filter(x=>mvSign(x)<0),x=>x.montant)))}</div>`
 +`<h2 style="margin-top:22px;font-size:20px">Soldes par client / partenaire</h2><input placeholder="🔍 Rechercher un client ou partenaire…" onkeyup="fl2(this,'tw1')" style="max-width:420px;margin-bottom:10px"><div class="tw card" style="padding:0"><table><thead><tr><th>Titulaire</th><th>Catégorie</th><th>Total déposé</th><th>Retiré / utilisé</th><th>Solde</th><th>Dernier mouvement</th><th></th></tr></thead><tbody id="tw1">${rw||'<tr><td colspan="7">Aucun compte. Cliquez sur « + Nouveau dépôt ».</td></tr>'}</tbody><tfoot><tr><td data-n="comptes"></td><td></td><td data-t="2" data-f="m"></td><td data-t="3" data-f="m"></td><td data-t="4" data-f="m"></td><td></td><td></td></tr></tfoot></table></div>`
 +`<h2 style="margin-top:22px;font-size:20px">Historique des mouvements</h2><input placeholder="🔍 Rechercher un mouvement (nom, date, motif…)" onkeyup="fl2(this,'tw2')" style="max-width:420px;margin-bottom:10px"><div class="tw card" style="padding:0"><table><thead><tr><th>Date</th><th>Titulaire</th><th>Type</th><th>Compte</th><th>Motif</th><th>Montant</th><th></th></tr></thead><tbody id="tw2">${rm||'<tr><td colspan="7">Aucun mouvement.</td></tr>'}</tbody><tfoot><tr><td data-n="mouvements"></td><td></td><td></td><td></td><td></td><td data-t="5" data-f="m" data-p="Net : "></td><td></td></tr></tfoot></table></div>`
 +`<div class="r" style="justify-content:flex-start"><button class="b m" onclick="mvForm('Dépôt')">+ Nouveau dépôt</button><button class="b s m" onclick="mvForm('Retrait')">Retrait</button></div>`}
const holderOpts=sel=>`<option value="">— Choisir —</option><optgroup label="Clients">${D.clients.map(x=>`<option value="clients:${x.id}" ${sel=="clients:"+x.id?"selected":""}>${esc(x.nom)}</option>`).join("")}</optgroup><optgroup label="Partenaires (fournisseurs)">${D.fournisseurs.map(x=>`<option value="fournisseurs:${x.id}" ${sel=="fournisseurs:"+x.id?"selected":""}>${esc(x.nom)}</option>`).join("")}</optgroup>`;
function mvForm(type,hold,id){const o=D.versements.find(x=>x.id==id)||{},h=id?(o.tid?o.kind+":"+o.tid:""):(hold||""),ty=id?(o.type||"Dépôt"):(type||"Dépôt");
 modal(`<h3>${id?"Modifier le mouvement":ty=="Retrait"?"Nouveau retrait":"Nouveau dépôt"}</h3><div class="g"><label>Type<select id="mv_t" onchange="mvBal()">${opts(["Dépôt","Retrait"].map(m=>[m,m]),ty)}</select></label><label>Client / partenaire<select id="mv_h" onchange="mvBal()">${holderOpts(h)}</select></label><label>Date<input id="mv_d" type="date" value="${o.date||today()}"></label><label>Montant<input id="mv_m" type="number" min="0" value="${o.montant||""}"></label><label>Compte (où est l’argent)<select id="mv_c">${opts(COMPTES.map(m=>[m,m]),o.compte||COMPTES[0])}</select></label><label>Motif / note<input id="mv_l" value="${esc(o.lib||"")}"></label></div><div class="tt" id="mv_b"></div><p><small>Le client ou partenaire n’est pas dans la liste ? Ajoutez-le d’abord dans « Clients » ou « Fournisseurs ».</small></p><div class="r"><button class="b s" onclick="cl()">Annuler</button><button class="b" onclick="saveMV('${id||""}')">Enregistrer</button></div>`);mvBal()}
function mvBal(){const e=$("#mv_b"),h=$("#mv_h").value;if(!e)return;if(!h){e.textContent="";return}const[k,t]=h.split(":");e.textContent="Solde actuel : "+fmt(balance(k,t))}

 if(!h){toast("Choisissez le client ou partenaire");return}
 if(montant<=0){toast("Saisissez un montant");return}
 const[kind,tid]=h.split(":"),e={id:id||uid(),date:$("#mv_d").value||today(),type,kind,tid,montant,compte:$("#mv_c").value,lib:$("#mv_l").value},rest=D.versements.filter(x=>x.id!=id);

 save();cl();render();toast(type=="Retrait"?"Retrait enregistré":"Dépôt enregistré")}

 modal(`<div class="r np" style="margin:0 0 10px"><button class="b" onclick="window._asPDF=1;printRel(..._rel)">📄 PDF</button><button class="b s" onclick="cl()">Fermer</button></div><h3>Relevé · ${esc(tid?nm(kind,tid):"Non attribué")}</h3><div class="tw"><table><thead><tr><th>Date</th><th>Opération</th><th>Entrée</th><th>Sortie</th><th>Solde</th></tr></thead><tbody>${R.map(r=>`<tr><td>${frd(r.x.date)}</td><td>${esc((r.x.type||"Dépôt")+(r.x.lib?" – "+r.x.lib:""))}</td><td data-v="${r.g>0?r.g:0}">${r.g>0?fmt(r.g):""}</td><td data-v="${r.g<0?-r.g:0}">${r.g<0?fmt(-r.g):""}</td><td>${fmt(r.s)}</td></tr>`).join("")||"<tr><td colspan='5'>Aucun mouvement.</td></tr>"}</tbody><tfoot><tr><td data-n="mouvements"></td><td></td><td data-t="2" data-f="m"></td><td data-t="3" data-f="m"></td><td>${fmt(sd)}</td></tr></tfoot></table></div><div class="tt">Solde actuel : ${fmt(sd)}</div>`);$("#md").style.maxWidth="820px"}

 $("#pa").innerHTML=`<style>.rl{font:700 16px/1.45 system-ui,"Segoe UI",sans-serif;color:var(--pri);width:194mm}.rl h1{font-size:24px;margin:0}.rl table{width:100%;border-collapse:collapse;margin-top:12px}.rl th{background:var(--pri);color:#fff;padding:7px 9px;text-align:left}.rl td{border-bottom:1.5px solid var(--pri);padding:6px 9px;color:var(--tx)}.rl .n{text-align:right}</style><div class="rl">${BND}<div style="border-bottom:3px solid var(--pri);padding:12px 0 10px"><h1>${esc(p.nom)}</h1><div>${esc(p.adr)}${p.tel?" · Tél : "+esc(p.tel):""}</div></div><h1 style="margin-top:14px">RELEVÉ DE COMPTE — DÉPÔT D’ARGENT</h1><div style="margin-top:6px">${esc(t.nom||"Non attribué")}${t.adr?"<br>Adresse : "+esc(t.adr):""}${t.tel?"<br>Tél : "+esc(t.tel):""}<br>Édité le ${new Date().toLocaleDateString("fr-FR")}</div><table><thead><tr><th>Date</th><th>Opération</th><th class="n">Entrée</th><th class="n">Sortie</th><th class="n">Solde</th></tr></thead><tbody>${R.map(r=>`<tr><td>${frd(r.x.date)}</td><td>${esc((r.x.type||"Dépôt")+(r.x.lib?" – "+r.x.lib:""))}</td><td class="n">${r.g>0?N(r.g):""}</td><td class="n">${r.g<0?N(-r.g):""}</td><td class="n">${N(r.s)}</td></tr>`).join("")}</tbody><tfoot><tr><td></td><td>TOTAL</td><td class="n">${N(sum(R.filter(r=>r.g>0),r=>r.g))}</td><td class="n">${N(sum(R.filter(r=>r.g<0),r=>-r.g))}</td><td class="n">${N(sd)}</td></tr></tfoot></table><div style="margin-top:14px;text-align:right;font-size:22px;font-weight:800;color:var(--btn)">SOLDE ACTUEL : ${fmt(sd)}</div><div style="margin-top:14px">${BND}</div></div>`;
 txNode($("#pa"));if(window._asPDF){window._asPDF=0;const h=$("#pa").innerHTML;toast("Création du PDF…");toPDF(h,"Releve_"+(t.nom||"general").replace(/[^\w-]+/g,"_")+".pdf").then(()=>toast("PDF téléchargé")).catch(()=>{document.body.classList.add("pd");window.print();setTimeout(()=>document.body.classList.remove("pd"),500)});return}document.body.classList.add("pd");window.print();setTimeout(()=>document.body.classList.remove("pd"),500)}

/* ---- historique par client / fournisseur ---- */
const DL={proforma:"Facture proforma",devis:"Devis",bl:"Bon de livraison",bc:"Bon de commande"};
function hist(c,id){const cli=c=="clients",t=D[c].find(x=>x.id==id)||{},R=[];
 if(cli){D.ventes.filter(v=>v.client==id).forEach(v=>{const T=tot(v.lines).ttc,ac=v.acompte==null?T:Math.min(v.acompte,T);R.push({ty:"Facture de vente",fa:1,num:v.num,date:v.date,T,paid:ac,st:T-ac>0?"Reste : "+fmt(T-ac):"Payé",op:`printV('${v.id}')`})});
  ["proforma","devis","bl"].forEach(k=>D[k].filter(r=>r.tiers==id).forEach(r=>R.push({ty:DL[k],num:r.num,date:r.date,T:tot(r.lines).ttc,st:r.statut,op:`prt('${k}','${r.id}')`})))}
